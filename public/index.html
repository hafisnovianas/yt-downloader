<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YT Downloader</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <div class="header-row">
      <h1>YT Downloader</h1>
      <button id="pin-btn" class="btn-ghost" type="button" title="Atur PIN Akses">
        <span id="pin-status-icon">🔒</span> PIN
      </button>
    </div>
    <p class="subtitle">Unduh audio murni (AAC) atau video (360p MP4) dari link YouTube.</p>

    <form id="form" autocomplete="off">
      <div class="input-row">
        <input
          type="text"
          id="url-input"
          placeholder="https://youtu.be/..."
          spellcheck="false"
          autofocus
          required
        >
        <button type="submit" id="fetch-btn">Ambil Info</button>
      </div>
    </form>

    <p id="error" class="error" hidden></p>

    <section id="result" hidden>
      <div class="video-info">
        <img id="thumbnail" alt="" loading="lazy">
        <div class="meta">
          <h2 id="title"></h2>
          <p id="author" class="secondary"></p>
          <p id="details" class="secondary"></p>
        </div>
      </div>

      <div class="btn-actions">
        <button id="audio-btn" class="btn-action btn-primary" type="button">
          Unduh Audio Murni (AAC)
        </button>
        <a id="video-btn" class="btn-action btn-secondary">
          Unduh Video (360p MP4)
        </a>
      </div>
      <p id="extract-status" class="extract-status" hidden></p>
    </section>
  </main>

  <!-- Dialog Modal PIN Akses -->
  <dialog id="pin-dialog" class="pin-modal">
    <form id="pin-form" method="dialog">
      <h3>PIN Akses Rahasia</h3>
      <p class="modal-desc">Situs ini diproteksi. Masukkan PIN untuk mengunduh.</p>
      <input
        type="password"
        id="pin-input"
        placeholder="Masukkan PIN..."
        autocomplete="current-password"
        required
      >
      <div class="modal-actions">
        <button type="button" id="pin-cancel-btn" class="btn-action btn-secondary">Batal</button>
        <button type="submit" class="btn-action btn-primary">Simpan PIN</button>
      </div>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
